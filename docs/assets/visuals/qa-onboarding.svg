<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">QA Automation Onboarding</title>
<desc id="d">An illustration of the course: a tester writes what they want in everyday words, an AI helper suggests a Playwright test, and running it shows that it passed.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfdcff"/><stop offset="1" stop-color="#efe6ff"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e293b" flood-opacity="0.2"/></filter>
<clipPath id="win"><rect x="50" y="34" width="1100" height="562" rx="16"/></clipPath>
</defs>
<style>
text{font-family:Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif}.m{font-family:Cascadia Code, Consolas, ui-monospace, Menlo, monospace}
.a{opacity:0;animation-duration:14s;animation-iteration-count:infinite;animation-timing-function:ease}
@keyframes c1{0%,5%{opacity:0}6%,94%{opacity:1}97%,100%{opacity:0}}@keyframes ct{0%,61%{opacity:0}62%,94%{opacity:1}97%,100%{opacity:0}}@keyframes cr{0%,73%{opacity:0}74%,94%{opacity:1}97%,100%{opacity:0}}@keyframes cb{0%,27%{opacity:0}28%,50%{opacity:1}53%,100%{opacity:0}}@keyframes cg{0%,27%{opacity:0}30%,48%{opacity:.45}53%,94%{opacity:1}98%,100%{opacity:0}}.c1{animation-name:c1}.ct{animation-name:ct}.cr{animation-name:cr}.cb{animation-name:cb}.ghost{animation-name:cg}
@media (prefers-reduced-motion: reduce){.a{animation:none;opacity:1}.alt{display:none}.ghost{opacity:1!important}}
</style>
<rect width="1200" height="630" fill="url(#bg)"/>
<rect x="50" y="34" width="1100" height="562" rx="16" fill="#ffffff" filter="url(#sh)"/>
<g clip-path="url(#win)"><rect x="50" y="34" width="1100" height="48" fill="#f3f4f6"/><rect x="50" y="81" width="1100" height="1" fill="#e5e7eb"/></g>
<circle cx="80" cy="58" r="7" fill="#f87171"/><circle cx="104" cy="58" r="7" fill="#fbbf24"/><circle cx="128" cy="58" r="7" fill="#34d399"/>
<text x="600.0" y="64" font-size="16" fill="#4b5563" text-anchor="middle">login.spec.ts — Visual Studio Code</text>
<text x="112" y="140" font-size="19" fill="#b6bdc9" text-anchor="end" class="m">1</text><text class="a m c1" x="138" y="140" font-size="25" fill="#1f2933" xml:space="preserve"><tspan fill="#6b7280">// Test: a user can sign in and see their dashboard</tspan></text><text x="112" y="186" font-size="19" fill="#b6bdc9" text-anchor="end" class="m">2</text><text class="a m ghost" x="138" y="186" font-size="25" fill="#1f2933" xml:space="preserve"><tspan fill="#7c3aed">test</tspan>(<tspan fill="#15803d">'user can sign in'</tspan>, <tspan fill="#7c3aed">async</tspan> ({ page }) =&gt; {</text><text x="112" y="232" font-size="19" fill="#b6bdc9" text-anchor="end" class="m">3</text><text class="a m ghost" x="138" y="232" font-size="25" fill="#1f2933" xml:space="preserve">  <tspan fill="#7c3aed">await</tspan> page.<tspan fill="#1d4ed8">goto</tspan>(<tspan fill="#15803d">'https://example.com/login'</tspan>);</text><text x="112" y="278" font-size="19" fill="#b6bdc9" text-anchor="end" class="m">4</text><text class="a m ghost" x="138" y="278" font-size="25" fill="#1f2933" xml:space="preserve">  <tspan fill="#7c3aed">await</tspan> page.<tspan fill="#1d4ed8">getByRole</tspan>(<tspan fill="#15803d">'button'</tspan>, { name: <tspan fill="#15803d">'Sign in'</tspan> }).<tspan fill="#1d4ed8">click</tspan>();</text><text x="112" y="324" font-size="19" fill="#b6bdc9" text-anchor="end" class="m">5</text><text class="a m ghost" x="138" y="324" font-size="25" fill="#1f2933" xml:space="preserve">  <tspan fill="#7c3aed">await</tspan> <tspan fill="#7c3aed">expect</tspan>(page.<tspan fill="#1d4ed8">getByText</tspan>(<tspan fill="#15803d">'Dashboard'</tspan>)).<tspan fill="#1d4ed8">toBeVisible</tspan>();</text><text x="112" y="370" font-size="19" fill="#b6bdc9" text-anchor="end" class="m">6</text><text class="a m ghost" x="138" y="370" font-size="25" fill="#1f2933" xml:space="preserve">});</text><g class="a cb"><rect x="820" y="100" width="296" height="38" rx="19" fill="#eef2ff" stroke="#c7d2fe"/><text x="968" y="125" font-size="16" fill="#4338ca" text-anchor="middle">Copilot suggests · Tab to accept</text></g><g clip-path="url(#win)"><rect x="50" y="418" width="1100" height="178" fill="#0f172a"/></g><text x="82" y="452" font-size="14" fill="#94a3b8" letter-spacing="2">TERMINAL</text><text class="a ct m" x="82" y="502" font-size="26" fill="#e2e8f0">$ npx playwright test</text><g class="a cr"><text class="m" x="82" y="550" font-size="26" fill="#4ade80">✓</text><text class="m" x="118" y="550" font-size="26" fill="#e2e8f0">1 passed</text></g></svg>
