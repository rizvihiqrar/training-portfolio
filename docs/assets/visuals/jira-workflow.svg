<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Jira for New Testers</title>
<desc id="d">An illustration of the guide: a Jira board with columns Raised, Triaged, In Progress, In Test, Done and Reopened. One ticket card moves right, is sent back through Reopened when a retest fails, and ends in Done.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#e9ddff"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e293b" flood-opacity="0.2"/></filter>
<clipPath id="win"><rect x="50" y="34" width="1100" height="562" rx="16"/></clipPath>
</defs>
<style>
text{font-family:Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif}.m{font-family:Cascadia Code, Consolas, ui-monospace, Menlo, monospace}
.a{opacity:0;animation-duration:14s;animation-iteration-count:infinite;animation-timing-function:ease}
@keyframes rb{0%,2%{opacity:0}3%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r7{0%,73%{opacity:0}74%,94%{opacity:1}97%,100%{opacity:0}}.rb{animation-name:rb}.r7{animation-name:r7}@keyframes mv{0%,2%{transform:translateX(0);opacity:0}3%{transform:translateX(0);opacity:1}3%,9%{transform:translateX(0px);opacity:1}14%,19%{transform:translateX(173px);opacity:1}24%,29%{transform:translateX(346px);opacity:1}34%,39%{transform:translateX(519px);opacity:1}46%,51%{transform:translateX(865px);opacity:1}58%,63%{transform:translateX(346px);opacity:1}68%,73%{transform:translateX(519px);opacity:1}78%,94%{transform:translateX(692px);opacity:1}97%,100%{transform:translateX(692px);opacity:0}}.tok{transform:translateX(692px)}@media (prefers-reduced-motion: reduce){.tok{animation:none!important}}
@media (prefers-reduced-motion: reduce){.a{animation:none;opacity:1}}
</style>
<rect width="1200" height="630" fill="url(#bg)"/>
<rect x="50" y="34" width="1100" height="562" rx="16" fill="#ffffff" filter="url(#sh)"/>
<g clip-path="url(#win)"><rect x="50" y="34" width="1100" height="48" fill="#f3f4f6"/><rect x="50" y="81" width="1100" height="1" fill="#e5e7eb"/></g>
<circle cx="80" cy="58" r="7" fill="#f87171"/><circle cx="104" cy="58" r="7" fill="#fbbf24"/><circle cx="128" cy="58" r="7" fill="#34d399"/>
<text x="600.0" y="64" font-size="16" fill="#4b5563" text-anchor="middle">Harbourline board</text>
<text class="a rb" x="106" y="124" font-size="26" fill="#374151">One owner for each column.</text><g class="a rb"><rect x="80" y="146" width="164" height="390" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/><rect x="80" y="146" width="164" height="52" rx="12" fill="#e0e7ff"/><text x="162" y="170" font-size="19" font-weight="600" fill="#3730a3" text-anchor="middle">Raised</text><text x="162" y="190" font-size="15" fill="#4b5563" text-anchor="middle">Triager</text></g><g class="a rb"><rect x="90" y="300" width="144" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="102" y="316" width="90" height="9" rx="4" fill="#e2e8f0"/><rect x="102" y="336" width="60" height="9" rx="4" fill="#e2e8f0"/></g><g class="a rb"><rect x="90" y="380" width="144" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="102" y="396" width="90" height="9" rx="4" fill="#e2e8f0"/><rect x="102" y="416" width="60" height="9" rx="4" fill="#e2e8f0"/></g><g class="a rb"><rect x="253" y="146" width="164" height="390" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/><rect x="253" y="146" width="164" height="52" rx="12" fill="#e0e7ff"/><text x="335" y="170" font-size="19" font-weight="600" fill="#3730a3" text-anchor="middle">Triaged</text><text x="335" y="190" font-size="15" fill="#4b5563" text-anchor="middle">Developer</text></g><g class="a rb"><rect x="263" y="300" width="144" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="275" y="316" width="90" height="9" rx="4" fill="#e2e8f0"/><rect x="275" y="336" width="60" height="9" rx="4" fill="#e2e8f0"/></g><g class="a rb"><rect x="426" y="146" width="164" height="390" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/><rect x="426" y="146" width="164" height="52" rx="12" fill="#dbeafe"/><text x="508" y="170" font-size="19" font-weight="600" fill="#1e3a8a" text-anchor="middle">In Progress</text><text x="508" y="190" font-size="15" fill="#4b5563" text-anchor="middle">Developer</text></g><g class="a rb"><rect x="436" y="300" width="144" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="448" y="316" width="90" height="9" rx="4" fill="#e2e8f0"/><rect x="448" y="336" width="60" height="9" rx="4" fill="#e2e8f0"/></g><g class="a rb"><rect x="599" y="146" width="164" height="390" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/><rect x="599" y="146" width="164" height="52" rx="12" fill="#dbeafe"/><text x="681" y="170" font-size="19" font-weight="600" fill="#1e3a8a" text-anchor="middle">In Test</text><text x="681" y="190" font-size="15" fill="#4b5563" text-anchor="middle">Tester</text></g><g class="a rb"><rect x="772" y="146" width="164" height="390" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/><rect x="772" y="146" width="164" height="52" rx="12" fill="#dcfce7"/><text x="854" y="170" font-size="19" font-weight="600" fill="#166534" text-anchor="middle">Done</text><text x="854" y="190" font-size="15" fill="#4b5563" text-anchor="middle">Nobody</text></g><g class="a rb"><rect x="782" y="300" width="144" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="794" y="316" width="90" height="9" rx="4" fill="#e2e8f0"/><rect x="794" y="336" width="60" height="9" rx="4" fill="#e2e8f0"/></g><g class="a rb"><rect x="782" y="380" width="144" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><rect x="794" y="396" width="90" height="9" rx="4" fill="#e2e8f0"/><rect x="794" y="416" width="60" height="9" rx="4" fill="#e2e8f0"/></g><g class="a rb"><rect x="945" y="146" width="164" height="390" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/><rect x="945" y="146" width="164" height="52" rx="12" fill="#fef3c7"/><text x="1027" y="170" font-size="19" font-weight="600" fill="#92400e" text-anchor="middle">Reopened</text><text x="1027" y="190" font-size="15" fill="#4b5563" text-anchor="middle">Developer</text></g><g class="tok" style="animation:mv 14s ease infinite"><rect x="90" y="214" width="144" height="86" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="3"/><text x="104" y="240" font-size="17" font-weight="700" fill="#1d4ed8">HBL-11</text><text x="104" y="264" font-size="14" fill="#374151">Login stays on</text><text x="104" y="284" font-size="14" fill="#374151">the page</text></g><text class="a r7" x="106" y="573" font-size="21" fill="#4b5563">A failed retest sends the card back.</text></svg>
