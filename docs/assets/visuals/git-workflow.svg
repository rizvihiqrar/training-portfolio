<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Git for New Testers</title>
<desc id="d">An illustration of the guide: four Git commands typed in a terminal while a branch graph grows beside them. A branch leaves main, gets a commit, is pushed to GitHub, goes to review as a pull request and merges back while main stays safe.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d3f5e5"/><stop offset="1" stop-color="#dde8ff"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e293b" flood-opacity="0.2"/></filter>
<clipPath id="win"><rect x="50" y="34" width="1100" height="562" rx="16"/></clipPath>
</defs>
<style>
text{font-family:Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif}.m{font-family:Cascadia Code, Consolas, ui-monospace, Menlo, monospace}
.a{opacity:0;animation-duration:14s;animation-iteration-count:infinite;animation-timing-function:ease}
@keyframes rb{0%,2%{opacity:0}3%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r1{0%,11%{opacity:0}12%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r2{0%,23%{opacity:0}24%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r3{0%,35%{opacity:0}36%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r4{0%,47%{opacity:0}48%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r5{0%,59%{opacity:0}60%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r6{0%,71%{opacity:0}72%,94%{opacity:1}97%,100%{opacity:0}}.rb{animation-name:rb}.r1{animation-name:r1}.r2{animation-name:r2}.r3{animation-name:r3}.r4{animation-name:r4}.r5{animation-name:r5}.r6{animation-name:r6}
@media (prefers-reduced-motion: reduce){.a{animation:none;opacity:1}}
</style>
<rect width="1200" height="630" fill="url(#bg)"/>
<rect x="50" y="34" width="1100" height="562" rx="16" fill="#ffffff" filter="url(#sh)"/>
<g clip-path="url(#win)"><rect x="50" y="34" width="1100" height="48" fill="#f3f4f6"/><rect x="50" y="81" width="1100" height="1" fill="#e5e7eb"/></g>
<circle cx="80" cy="58" r="7" fill="#f87171"/><circle cx="104" cy="58" r="7" fill="#fbbf24"/><circle cx="128" cy="58" r="7" fill="#34d399"/>
<text x="600.0" y="64" font-size="16" fill="#4b5563" text-anchor="middle">harbourline-tests</text>
<text class="a rb" x="106" y="128" font-size="26" fill="#374151">Work on a branch. Main stays safe.</text><g class="a rb"><rect x="80" y="154" width="490" height="400" rx="12" fill="#1e1e1e"/></g><text class="a r1 m" x="104" y="200" font-size="18" fill="#d4d4d4"><tspan fill="#6a9955">$</tspan> <tspan fill="#dcdcaa">git</tspan> switch -c add-login-check</text><text class="a r2 m" x="104" y="248" font-size="18" fill="#d4d4d4"><tspan fill="#6a9955">$</tspan> <tspan fill="#dcdcaa">git</tspan> add tests/login.spec.ts</text><text class="a r3 m" x="104" y="296" font-size="18" fill="#d4d4d4"><tspan fill="#6a9955">$</tspan> <tspan fill="#dcdcaa">git</tspan> commit -m &quot;Add login check&quot;</text><text class="a r4 m" x="104" y="344" font-size="18" fill="#d4d4d4"><tspan fill="#6a9955">$</tspan> <tspan fill="#dcdcaa">git</tspan> push -u origin add-login-check</text><g class="a rb"><rect x="606" y="154" width="96" height="36" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="654" y="179" font-size="16" font-weight="600" fill="#4b5563" text-anchor="middle">Branch</text></g><g class="a rb"><rect x="710" y="154" width="96" height="36" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="758" y="179" font-size="16" font-weight="600" fill="#4b5563" text-anchor="middle">Commit</text></g><g class="a rb"><rect x="814" y="154" width="96" height="36" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="862" y="179" font-size="16" font-weight="600" fill="#4b5563" text-anchor="middle">Push</text></g><g class="a rb"><rect x="918" y="154" width="96" height="36" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="966" y="179" font-size="16" font-weight="600" fill="#4b5563" text-anchor="middle">Review</text></g><g class="a rb"><rect x="1022" y="154" width="96" height="36" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="1070" y="179" font-size="16" font-weight="600" fill="#4b5563" text-anchor="middle">Merged</text></g><g class="a r1"><rect x="606" y="154" width="96" height="36" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="654" y="179" font-size="16" font-weight="600" fill="#1e3a8a" text-anchor="middle">Branch</text></g><g class="a r3"><rect x="710" y="154" width="96" height="36" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="758" y="179" font-size="16" font-weight="600" fill="#1e3a8a" text-anchor="middle">Commit</text></g><g class="a r4"><rect x="814" y="154" width="96" height="36" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="862" y="179" font-size="16" font-weight="600" fill="#1e3a8a" text-anchor="middle">Push</text></g><g class="a r5"><rect x="918" y="154" width="96" height="36" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="966" y="179" font-size="16" font-weight="600" fill="#5b21b6" text-anchor="middle">Review</text></g><g class="a r6"><rect x="1022" y="154" width="96" height="36" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="1070" y="179" font-size="16" font-weight="600" fill="#166534" text-anchor="middle">Merged</text></g><line class="a rb" x1="620" y1="440" x2="1110" y2="440" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/><circle class="a rb" cx="660" cy="440" r="14" fill="#6b7280"/><circle class="a rb" cx="740" cy="440" r="14" fill="#6b7280"/><text class="a rb" x="660" y="482" font-size="18" fill="#4b5563" text-anchor="middle">main</text><path class="a r1" d="M740 440 C790 440 800 320 860 320 L930 320 C990 320 1000 440 1050 440" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/><text class="a r1" x="895" y="284" font-size="18" fill="#1d4ed8" text-anchor="middle">add-login-check</text><circle class="a r3" cx="895" cy="320" r="14" fill="#2563eb"/><g class="a r4"><rect x="820" y="350" width="150" height="34" rx="17" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="895" y="373" font-size="16" font-weight="600" fill="#1e3a8a" text-anchor="middle">on GitHub</text></g><g class="a r5"><rect x="962" y="228" width="150" height="40" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1037" y="254" font-size="17" font-weight="600" fill="#5b21b6" text-anchor="middle">Pull request</text></g><circle class="a r6" cx="1050" cy="440" r="19" fill="#16a34a"/></svg>
