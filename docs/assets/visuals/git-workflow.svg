<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">Git for People New to Version Control</title>
<desc id="d">An illustration of the guide: a branch leaves the main line, gets two commits, and returns through a pull request while main stays safe.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d3f5e5"/><stop offset="1" stop-color="#dde8ff"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e293b" flood-opacity="0.2"/></filter>
<clipPath id="win"><rect x="50" y="34" width="1100" height="562" rx="16"/></clipPath>
</defs>
<style>
text{font-family:Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif}.m{font-family:Cascadia Code, Consolas, ui-monospace, Menlo, monospace}
.a{opacity:0;animation-duration:14s;animation-iteration-count:infinite;animation-timing-function:ease}
@keyframes rb{0%,3%{opacity:0}4%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r1{0%,17%{opacity:0}18%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r2{0%,27%{opacity:0}28%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r3{0%,35%{opacity:0}36%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r4{0%,45%{opacity:0}46%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r5{0%,53%{opacity:0}54%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r6{0%,61%{opacity:0}62%,94%{opacity:1}97%,100%{opacity:0}}@keyframes r7{0%,69%{opacity:0}70%,94%{opacity:1}97%,100%{opacity:0}}.rb{animation-name:rb}.r1{animation-name:r1}.r2{animation-name:r2}.r3{animation-name:r3}.r4{animation-name:r4}.r5{animation-name:r5}.r6{animation-name:r6}.r7{animation-name:r7}
@media (prefers-reduced-motion: reduce){.a{animation:none;opacity:1}.alt{display:none}.ghost{opacity:1!important}}
</style>
<rect width="1200" height="630" fill="url(#bg)"/>
<rect x="50" y="34" width="1100" height="562" rx="16" fill="#ffffff" filter="url(#sh)"/>
<g clip-path="url(#win)"><rect x="50" y="34" width="1100" height="48" fill="#f3f4f6"/><rect x="50" y="81" width="1100" height="1" fill="#e5e7eb"/></g>
<circle cx="80" cy="58" r="7" fill="#f87171"/><circle cx="104" cy="58" r="7" fill="#fbbf24"/><circle cx="128" cy="58" r="7" fill="#34d399"/>
<text x="600.0" y="64" font-size="16" fill="#4b5563" text-anchor="middle">harbourline-tests</text>
<text class="a rb" x="106" y="150" font-size="26" fill="#374151">Work on a branch. Main stays safe.</text><line class="a rb" x1="130" y1="400" x2="1070" y2="400" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/><text class="a rb" x="130" y="450" font-size="22" fill="#4b5563">main</text><circle class="a rb" cx="190" cy="400" r="16" fill="#6b7280"/><circle class="a rb" cx="360" cy="400" r="16" fill="#6b7280"/><path class="a r1" d="M360 400 C420 400 430 260 500 260 L700 260 C770 260 780 400 850 400" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/><text class="a r1" x="500" y="222" font-size="22" fill="#1d4ed8">add-login-check</text><circle class="a r2" cx="530" cy="260" r="16" fill="#2563eb"/><text class="a r2" x="530" y="312" font-size="20" fill="#374151" text-anchor="middle">commit 1</text><circle class="a r3" cx="670" cy="260" r="16" fill="#2563eb"/><text class="a r3" x="670" y="312" font-size="20" fill="#374151" text-anchor="middle">commit 2</text><g class="a r4"><rect x="772" y="470" width="248" height="52" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="896" y="504" font-size="22" font-weight="600" fill="#166534" text-anchor="middle">Pull request: review</text></g><circle class="a r5" cx="850" cy="400" r="20" fill="#16a34a"/><text class="a r5" x="902" y="406" font-size="22" fill="#166534">merged</text><text class="a r6" x="106" y="570" font-size="22" fill="#4b5563">Four sessions: save points, branches, sharing, conflicts.</text></svg>
